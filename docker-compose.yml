  transport-api:
    build:
      context: .
      dockerfile: Services/Transport.API/Dockerfile
    container_name: schoolerp-transport-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Seq__Url: "http://seq:5341"
      ConnectionStrings__TransportDb: "Server=${TIDB_HOST:-127.0.0.1};Port=${TIDB_PORT:-4000};Database=transport;Uid=${TIDB_USER};Pwd=${TIDB_PASSWORD};SslMode=VerifyFull;"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Issuer: ${JWT_ISSUER:-SchoolERP.Identity}
      Jwt__Audience: ${JWT_AUDIENCE:-SchoolERP.Clients}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Services__StudentApiBaseUrl: "http://student-api:8080"
    ports:
      - "127.0.0.1:5110:8080"

  notification-api:
    build:
      context: .
      dockerfile: Services/Notification.API/Dockerfile
    container_name: schoolerp-notification-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
