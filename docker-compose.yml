      ASPNETCORE_ENVIRONMENT: Production
      Seq__Url: "http://seq:5341"
      ConnectionStrings__NotificationDb: "Server=${TIDB_HOST:-127.0.0.1};Port=${TIDB_PORT:-4000};Database=notification;Uid=${TIDB_USER};Pwd=${TIDB_PASSWORD};SslMode=VerifyFull;"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Issuer: ${JWT_ISSUER:-SchoolERP.Identity}
      Jwt__Audience: ${JWT_AUDIENCE:-SchoolERP.Clients}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-schoolerp}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-devpassword}
    ports:
      - "127.0.0.1:5111:8080"

  reporting-api:
    build:
      context: .
      dockerfile: Services/Reporting.API/Dockerfile
    container_name: schoolerp-reporting-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      student-api:
        condition: service_started
      fee-api:
        condition: service_started
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Seq__Url: "http://seq:5341"
      ConnectionStrings__ReportingDb: "Server=${TIDB_HOST:-127.0.0.1};Port=${TIDB_PORT:-4000};Database=reporting;Uid=${TIDB_USER};Pwd=${TIDB_PASSWORD};SslMode=VerifyFull;"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Issuer: ${JWT_ISSUER:-SchoolERP.Identity}
      Jwt__Audience: ${JWT_AUDIENCE:-SchoolERP.Clients}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Services__StudentApiBaseUrl: "http://student-api:8080"
      Services__FeeApiBaseUrl: "http://fee-api:8080"
    ports:
      - "127.0.0.1:5112:8080"

  gateway:
    build:
      context: .
      dockerfile: Gateway/SchoolERP.Gateway/Dockerfile
    container_name: schoolerp-gateway
    restart: unless-stopped
    depends_on:
      - identity-api
      - student-api
      - staff-api
      - attendance-api
      - academic-api
      - examination-api
      - fee-api
      - communication-api
      - library-api
      - transport-api
      - notification-api
      - reporting-api
      - redis
      - seq
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Seq__Url: "http://seq:5341"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Issuer: ${JWT_ISSUER:-SchoolERP.Identity}
      Jwt__Audience: ${JWT_AUDIENCE:-SchoolERP.Clients}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Cors__AllowedOrigins__0: ${FRONTEND_URL:-http://localhost:4200}
    ports:
      # Bound to loopback only: the gateway is reached from the outside world via
      # Caddy (below), never directly. `curl http://localhost:5100/...` still works
      # from *this* machine for local debugging -- it just isn't reachable from
      # anywhere else, so there's no way to bypass TLS termination from outside.
      - "127.0.0.1:5100:8080"

  # TLS termination + reverse proxy in front of the gateway. Caddy handles cert
  # issuance/renewal automatically (see Caddyfile) -- set DOMAIN in .env to a real,
  # publicly-resolvable name and open 80/443 on this host to go live; until then it
  # falls back to `localhost` with a local/internal cert, no ACME calls attempted.
  caddy:
    image: caddy:2-alpine
    container_name: schoolerp-caddy
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
