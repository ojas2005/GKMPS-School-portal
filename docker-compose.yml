    depends_on:
      redis:
        condition: service_healthy
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Seq__Url: "http://seq:5341"
      ConnectionStrings__AttendanceDb: "Server=${TIDB_HOST:-127.0.0.1};Port=${TIDB_PORT:-4000};Database=attendance;Uid=${TIDB_USER};Pwd=${TIDB_PASSWORD};SslMode=VerifyFull;"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Issuer: ${JWT_ISSUER:-SchoolERP.Identity}
      Jwt__Audience: ${JWT_AUDIENCE:-SchoolERP.Clients}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    ports:
      - "127.0.0.1:5104:8080"

  academic-api:
    build:
      context: .
      dockerfile: Services/Academic.API/Dockerfile
    container_name: schoolerp-academic-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Seq__Url: "http://seq:5341"
      ConnectionStrings__AcademicDb: "Server=${TIDB_HOST:-127.0.0.1};Port=${TIDB_PORT:-4000};Database=academic;Uid=${TIDB_USER};Pwd=${TIDB_PASSWORD};SslMode=VerifyFull;"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Issuer: ${JWT_ISSUER:-SchoolERP.Identity}
      Jwt__Audience: ${JWT_AUDIENCE:-SchoolERP.Clients}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    ports:
      - "127.0.0.1:5105:8080"

  examination-api:
    build:
      context: .
      dockerfile: Services/Examination.API/Dockerfile
    container_name: schoolerp-examination-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      azurite:
        condition: service_started
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Seq__Url: "http://seq:5341"
      ConnectionStrings__ExaminationDb: "Server=${TIDB_HOST:-127.0.0.1};Port=${TIDB_PORT:-4000};Database=examination;Uid=${TIDB_USER};Pwd=${TIDB_PASSWORD};SslMode=VerifyFull;"
      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__BlobStorage: ${AZURE_BLOB_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
      BlobStorage__PublicBaseUrl: ${AZURE_BLOB_PUBLIC_BASE_URL:-}
      Jwt__Issuer: ${JWT_ISSUER:-SchoolERP.Identity}
      Jwt__Audience: ${JWT_AUDIENCE:-SchoolERP.Clients}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
