name: schoolerp

services:
  redis:
    image: redis:7-alpine
    container_name: schoolerp-redis
    restart: unless-stopped
    ports:
      # 6380 on the host because a locally-installed Redis often owns 127.0.0.1:6379.
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: schoolerp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-schoolerp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-devpassword}
    ports:
      # Host ports are for local debugging only (containers use the compose network) --
      # 5673 on the host because a locally-installed RabbitMQ often owns 127.0.0.1:5672.
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15672:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Azure Storage emulator: backs the QuestPDF file uploads (receipts, report cards,
  # transfer certificates) for Fee/Examination/Student.API in local dev, in place of a
  # real Azure Storage account. Port 10000 (blob) is published to the host too, since
  # the SAS download URLs need to be reachable from the developer's browser, not just
  # from other containers -- see AzureBlobStorageService.RewriteForPublicAccess.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: schoolerp-azurite
    restart: unless-stopped
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000"
    ports:
      - "127.0.0.1:10000:10000"

  # Centralized structured-log viewer: every service ships the same Serilog events here
  # (see BuildingBlocks/SchoolERP.Shared/Logging/SharedLogging.cs) in addition to its own
  # console output, so "did the fee-payment event actually fire" is one search across all
  # 12 services instead of `docker compose logs` per-container. UI: http://localhost:8081
  seq:
    image: datalust/seq:latest
    container_name: schoolerp-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Local dev only, not exposed beyond the developer's machine (see docker-compose
      # port mapping below) -- for a real deployment, set SEQ_FIRSTRUN_ADMINPASSWORD
      # (or an equivalent secret) instead and drop this.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "127.0.0.1:8081:80"   # web UI
      - "127.0.0.1:5341:5341" # ingestion endpoint (Seq__Url below)

  identity-api:
    build:
      context: .
      dockerfile: Services/Identity.API/Dockerfile
    container_name: schoolerp-identity-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Seq__Url: "http://seq:5341"
      ConnectionStrings__IdentityDb: "Server=${TIDB_HOST:-127.0.0.1};Port=${TIDB_PORT:-4000};Database=identity;Uid=${TIDB_USER};Pwd=${TIDB_PASSWORD};SslMode=VerifyFull;"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Issuer: ${JWT_ISSUER:-SchoolERP.Identity}
      Jwt__Audience: ${JWT_AUDIENCE:-SchoolERP.Clients}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      # First-boot seed only (ignored once the owner account exists). If unset, a random
      # password is generated and printed once in this container's logs.
      Owner__Password: ${OWNER_PASSWORD:-}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-schoolerp}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-devpassword}
    ports:
      - "127.0.0.1:5101:8080"

  student-api:
    build:
      context: .
      dockerfile: Services/Student.API/Dockerfile
    container_name: schoolerp-student-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      azurite:
        condition: service_started
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Seq__Url: "http://seq:5341"
      ConnectionStrings__StudentDb: "Server=${TIDB_HOST:-127.0.0.1};Port=${TIDB_PORT:-4000};Database=student;Uid=${TIDB_USER};Pwd=${TIDB_PASSWORD};SslMode=VerifyFull;"
      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__BlobStorage: ${AZURE_BLOB_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
      BlobStorage__PublicBaseUrl: ${AZURE_BLOB_PUBLIC_BASE_URL:-}
      Jwt__Issuer: ${JWT_ISSUER:-SchoolERP.Identity}
      Jwt__Audience: ${JWT_AUDIENCE:-SchoolERP.Clients}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-schoolerp}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-devpassword}
    ports:
      - "127.0.0.1:5102:8080"

  staff-api:
    build:
      context: .
      dockerfile: Services/Staff.API/Dockerfile
    container_name: schoolerp-staff-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Seq__Url: "http://seq:5341"
      ConnectionStrings__StaffDb: "Server=${TIDB_HOST:-127.0.0.1};Port=${TIDB_PORT:-4000};Database=staff;Uid=${TIDB_USER};Pwd=${TIDB_PASSWORD};SslMode=VerifyFull;"
      ConnectionStrings__Redis: "redis:6379"
