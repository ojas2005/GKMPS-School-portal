name: schoolerp

services:
  # The whole backend: one ASP.NET Core app (presentation, business and data-access tiers).
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: schoolerp-app
    restart: unless-stopped
    depends_on:
      # Only started with the local profiles; ignored when TIDB_*/AZURE_BLOB_* point at the cloud.
      tidb:
        condition: service_healthy
        required: false
      azurite:
        condition: service_started
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # One server hosts every module's database (identity, student, fee, ...); the app picks
      # the database per module. Production uses TiDB Cloud (TLS VerifyFull).
      ConnectionStrings__SchoolDb: "Server=${TIDB_HOST:-127.0.0.1};Port=${TIDB_PORT:-4000};Uid=${TIDB_USER};Pwd=${TIDB_PASSWORD};SslMode=${TIDB_SSL_MODE:-VerifyFull};"
      # Generated PDFs: "Database" (default, free) or "AzureBlob" (uses the connection below).
      FileStorage__Provider: ${FILE_STORAGE_PROVIDER:-Database}
      ConnectionStrings__BlobStorage: ${AZURE_BLOB_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
      BlobStorage__PublicBaseUrl: ${AZURE_BLOB_PUBLIC_BASE_URL:-}
      Jwt__Issuer: ${JWT_ISSUER:-SchoolERP.Identity}
      Jwt__Audience: ${JWT_AUDIENCE:-SchoolERP.Clients}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      # First-boot seed only (ignored once the owner account exists). If unset, a random
      # password is generated and printed once in this container's logs.
      Owner__Username: ${OWNER_USERNAME:-ownerishim}
      Owner__Password: ${OWNER_PASSWORD:-}
      # Minutes without activity before a user is signed out.
      Session__IdleTimeoutMinutes: ${SESSION_IDLE_TIMEOUT_MINUTES:-30}
      Cors__AllowedOrigins__0: ${FRONTEND_URL:-http://localhost:4200}
      Seq__Url: ${SEQ_URL:-}
      # Real email delivery (optional). Leave SMTP_HOST empty to log notifications only.
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
    ports:
      # Loopback only: reached from outside through Caddy. The Angular dev server proxies /api here.
      - "127.0.0.1:5100:8080"

  # TLS termination + reverse proxy in front of the app (automatic Let's Encrypt when DOMAIN
  # is a real, publicly-resolvable name; a local certificate for `localhost`).
  caddy:
    image: caddy:2-alpine
    container_name: schoolerp-caddy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # ---------- Local development only (enable with COMPOSE_PROFILES in .env) ----------

  # Local TiDB instead of TiDB Cloud. Profile: local-db.
  tidb:
    image: pingcap/tidb:v8.5.1
    container_name: schoolerp-tidb
    profiles: ["local-db"]
    restart: unless-stopped
    command: ["--store=unistore", "--path=/data/tidb"]
    volumes:
      - tidb-data:/data
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:10080/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Azure Storage emulator for receipts/report cards/certificates. Profile: local-storage.
  # Port 10000 is published because SAS download URLs must be reachable from the browser
  # (AZURE_BLOB_PUBLIC_BASE_URL rewrites them to localhost).
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: schoolerp-azurite
    profiles: ["local-storage"]
    restart: unless-stopped
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000"
    ports:
      - "127.0.0.1:10000:10000"

  # Structured-log viewer (UI http://localhost:8081). Profile: seq; also set SEQ_URL=http://seq:5341.
  seq:
    image: datalust/seq:latest
    container_name: schoolerp-seq
    profiles: ["seq"]
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Loopback-only local tool; set SEQ_FIRSTRUN_ADMINPASSWORD instead if it is ever exposed.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "127.0.0.1:8081:80"
      - "127.0.0.1:5341:5341"

volumes:
  tidb-data:
  caddy-data:
  caddy-config:
