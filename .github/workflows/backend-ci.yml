name: Backend CI

# Runs on every push/PR touching the backend so a broken commit is caught here instead
# of during `docker compose up --build` on someone's machine (or worse, in production).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SchoolERP.sln

      - name: Build (Release, warnings as errors off — see note)
        run: dotnet build SchoolERP.sln --no-restore --configuration Release

      # Unit tests in Tests/SchoolERP.Tests (role hierarchy, claim scoping, rate-limit
      # partitioning, per-module connection strings, in-process events).
      - name: Test
        run: dotnet test SchoolERP.sln --no-build --configuration Release

  # Builds the production image and, on pushes, publishes it to GitHub Container Registry
  # (ghcr.io) -- free for a public repository, unlike a paid Azure registry. Every pushed
  # commit gets an image tagged with its SHA; main also moves "latest". Pull requests only
  # build it, which still catches Dockerfile drift a plain `dotnet build` can't see.
  image:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/schoolerp-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on pushes)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Every push to main that passes the tests and builds an image goes live: the container
  # app is switched to the image just pushed (tagged with this commit), and the job waits
  # until the new revision answers /health. Azure sign-in uses GitHub's OIDC token, so no
  # password or key is stored here; the Azure identity may only touch this one container app.
  # Database migrations run when the new revision starts (DatabaseInitializer).
  deploy:
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/schoolerp-app:${{ github.sha }}
      RESOURCE_GROUP: gkmps-prod
      CONTAINER_APP: gkmps-api
    steps:
      - name: Sign in to Azure (OIDC, no stored secret)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Switch the API to this commit's image
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          az containerapp update -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" --image "$IMAGE" \
            --query "{revision:properties.latestRevisionName,state:properties.provisioningState}" -o table

      # The first start after a deploy can take a minute or two: the free TiDB cluster wakes
      # up and any new migrations run before the app listens.
      - name: Wait for the new revision to be healthy
        run: |
          fqdn=$(az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            image=$(az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" --query "properties.template.containers[0].image" -o tsv)
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://$fqdn/health" || true)
            echo "attempt $i: image=$image health=$code"
            if [ "$image" = "$IMAGE" ] && [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::The API did not become healthy on $IMAGE"
          az containerapp logs show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" --tail 50 --type console || true
          exit 1
