name: Backend CI

# Runs on every push/PR touching the backend so a broken commit is caught here instead
# of during `docker compose up --build` on someone's machine (or worse, in production).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore SchoolERP.sln

      - name: Build (Release, warnings as errors off — see note)
        run: dotnet build SchoolERP.sln --no-restore --configuration Release

      # No test projects exist yet (see README "Next steps"). This step is intentionally
      # here now, not bolted on later: it already runs on every push and currently passes
      # trivially (dotnet test exits 0 with zero test projects) so the moment a test
      # project is added under Tests/, it starts running in CI with no workflow change.
      - name: Test
        run: dotnet test SchoolERP.sln --no-build --configuration Release

  # Building the actual Docker images is a stronger signal than `dotnet build` alone --
  # it catches Dockerfile drift (e.g. a missing COPY, a stale base image tag) that a
  # plain SDK build can't see. Runs after build-and-test so we don't spend the extra
  # minutes on a commit that was already broken.
  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      matrix:
        service:
          - Identity.API
          - Student.API
          - Staff.API
          - Attendance.API
          - Academic.API
          - Examination.API
          - Fee.API
          - Communication.API
          - Library.API
          - Transport.API
          - Notification.API
          - Reporting.API
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        run: docker build -f Services/${{ matrix.service }}/Dockerfile -t schoolerp-${{ matrix.service }}:ci .

      - name: Build Gateway image
        if: matrix.service == 'Identity.API' # only needs to run once, piggybacking on the first matrix leg
        run: docker build -f Gateway/SchoolERP.Gateway/Dockerfile -t schoolerp-gateway:ci .
